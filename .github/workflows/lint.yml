name: Lint

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  lint:
    runs-on: 'ubuntu-latest'

    steps:
      - uses: actions/checkout@v7

      - name: Read formatter version
        id: formatter
        run: |
          version=$(grep -oP 'version="\K[^"]+' addons/GDQuest_GDScript_formatter/plugin.cfg)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: DevTwilight/setup-gdscript-formatter@v1.0.0
        with:
          version: ${{ steps.formatter.outputs.version }}
          cache: true

      - name: Check formatting
        run: gdscript-formatter --check .

      - name: Lint
        run: gdscript-formatter lint --pretty .
