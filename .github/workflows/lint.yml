name: Lint

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  lint:
    runs-on: 'ubuntu-latest'

    steps:
      - uses: actions/checkout@v7

      - uses: DevTwilight/setup-gdscript-formatter@v1.0.0
        with:
          version: '0.26.0'
          cache: true

      - name: Check formatting
        run: gdscript-formatter --check .

      - name: Lint (advisory)
        continue-on-error: true
        run: gdscript-formatter lint --pretty .
