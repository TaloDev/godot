name: Unit tests

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  unit-tests:
    runs-on: 'ubuntu-latest'

    permissions:
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: MikeSchulze/gdUnit4-action@v1.3.2
        with:
          godot-version: '4.7.2'
          paths: res://test
          publish-report: false
          report-name: unit-test-report.xml
